<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ttdpoint - 无畏契约点位浏览器</title>
<style>
:root {
    --bg: #0f1923;
    --bg2: #1a2735;
    --bg3: #243447;
    --text: #ece8e1;
    --text2: #8b978f;
    --accent: #ff4655;
    --accent2: #ff6b77;
    --gold: #ffd700;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--bg3); flex-shrink: 0; }
.logo { font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.logo span { color: var(--text2); font-weight: 400; font-size: 12px; margin-left: 4px; }
.search { flex: 1; position: relative; max-width: 300px; }
.search input { width: 100%; padding: 7px 32px 7px 12px; border-radius: 6px; border: 1px solid var(--bg3); background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text2); font-size: 16px; display: none; }
.search .clear.show { display: block; }
.filters { display: flex; gap: 8px; flex-shrink: 0; }
.filters select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--bg3); background: var(--bg); color: var(--text); font-size: 12px; outline: none; }
.filters select:focus { border-color: var(--accent); }
.submit-btn { padding: 6px 14px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-size: 12px; cursor: pointer; white-space: nowrap; }
.submit-btn:hover { background: var(--accent2); }
.main { display: flex; flex: 1; overflow: hidden; }
.list-panel { width: 360px; min-width: 280px; overflow-y: auto; border-right: 1px solid var(--bg3); flex-shrink: 0; }
.list-panel::-webkit-scrollbar { width: 4px; }
.list-panel::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
.list-count { padding: 8px 16px; font-size: 12px; color: var(--text2); background: var(--bg2); border-bottom: 1px solid var(--bg3); }
.card { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--bg3); transition: background .15s; }
.card:hover, .card.active { background: var(--bg2); }
.card .thumb { width: 72px; height: 48px; border-radius: 4px; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
.card .thumb:not([src]) { background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.card .info { flex: 1; min-width: 0; }
.card .title { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { font-size: 11px; color: var(--text2); display: flex; gap: 8px; flex-wrap: wrap; }
.card .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; background: var(--accent); color: #fff; }
.detail-panel { flex: 1; overflow-y: auto; padding: 24px; }
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
.detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text2); font-size: 14px; }
.detail-header { margin-bottom: 20px; }
.detail-header h2 { font-size: 22px; margin-bottom: 8px; }
.detail-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--text2); margin-bottom: 12px; }
.detail-meta span { background: var(--bg3); padding: 4px 10px; border-radius: 4px; }
.detail-desc { font-size: 14px; line-height: 1.6; margin-bottom: 16px; color: var(--text2); }
.steps { display: flex; flex-direction: column; gap: 16px; }
.step-box { background: var(--bg2); border-radius: 8px; overflow: hidden; }
.step-box .lazy-img:not([src]) { min-height: 200px; background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.step-box img { width: 100%; cursor: pointer; display: block; }
.step-box .step-desc { padding: 8px 12px; font-size: 12px; color: var(--text2); }
.detail-contributor { margin-top: 20px; font-size: 12px; color: var(--text2); }
.mobile-back { display: none; }
/* Mobile */
@media (max-width: 768px) {
    .main { flex-direction: column; position: relative; }
    .list-panel { width: 100%; min-width: auto; max-height: none; border-right: none; border-bottom: 1px solid var(--bg3); flex: 1; overflow-y: auto; display: block; }
    .main.detail-open .list-panel { display: none; }
    .detail-panel { flex: 1; padding: 16px; display: none; overflow-y: auto; }
    .main.detail-open .detail-panel { display: block; }
    .topbar { flex-wrap: wrap; }
    .step-box img { width: 100%; height: auto; max-height: 60vh; object-fit: contain; }
    .card .thumb { width: 60px; height: 40px; object-fit: cover; }
    .detail-header h2 { font-size: 18px; }
    .mobile-back { display: none; }
    .main.detail-open .mobile-back { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--bg3); cursor: pointer; font-size: 14px; color: var(--accent); position: sticky; top: 0; z-index: 10; }
    .main.detail-open .topbar { display: none; }
}
/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-overlay img { max-width: 95vw; max-height: 95vh; cursor: pointer; }
/* Viewer */
.img-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 200; align-items: center; justify-content: center; }
.img-viewer.show { display: flex; }
.img-viewer img { max-width: 95vw; max-height: 95vh; }
/* Submit modal */
.submit-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 150; align-items: center; justify-content: center; }
.submit-modal.show { display: flex; }
.submit-modal .modal-box { background: var(--bg2); border-radius: 12px; padding: 24px; width: 90vw; max-width: 500px; max-height: 80vh; overflow-y: auto; }
.submit-modal h3 { font-size: 18px; margin-bottom: 16px; }
.submit-modal .form-group { margin-bottom: 14px; }
.submit-modal label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.submit-modal input, .submit-modal select, .submit-modal textarea { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--bg3); background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
.submit-modal textarea { resize: vertical; min-height: 60px; }
.submit-modal input:focus, .submit-modal select:focus, .submit-modal textarea:focus { border-color: var(--accent); }
.submit-modal .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.submit-modal .btn-cancel { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--bg3); background: transparent; color: var(--text); cursor: pointer; }
.submit-modal .btn-confirm { padding: 8px 16px; border-radius: 6px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
.submit-modal .file-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.submit-modal .file-preview .preview-item { position: relative; width: 80px; height: 56px; border-radius: 4px; overflow: hidden; background: var(--bg3); }
.submit-modal .file-preview .preview-item img { width: 100%; height: 100%; object-fit: cover; }
.submit-modal .file-preview .preview-item .remove-file { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; font-size: 12px; line-height: 18px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">ttdpoint<span>Lineup</span></div>
    <div class="search">
        <input type="text" id="searchInput" placeholder="搜索点位...">
        <span class="clear" id="searchClear">&times;</span>
    </div>
    <div class="filters">
        <select id="fMap"><option value="">全部地图</option></select>
        <select id="fAgent"><option value="">全部英雄</option></select>
        <select id="fAbility"><option value="">全部技能</option></select>
        <select id="fSide"><option value="">全部阵营</option><option value="进攻">进攻</option><option value="防守">防守</option></select>
    </div>
    <button class="submit-btn" onclick="openSubmit()">投稿</button>
</div>

<div class="main">
    <div class="list-panel" id="listPanel">
        <div class="list-count" id="listCount"></div>
        <div id="listContainer"></div>
    </div>
    <div class="mobile-back" id="mobileBack" onclick="closeDetail()"><span>&larr;</span> 返回列表</div>
    <div class="detail-panel" id="detailPanel">
        <div class="detail-empty">选择一个点位查看详情</div>
    </div>
</div>

<div class="img-viewer" id="imgViewer"><img id="imgViewerImg" src=""></div>

<div class="submit-modal" id="submitModal">
    <div class="modal-box">
        <h3>投稿点位</h3>
        <div class="form-group"><label>点位名称 *</label><input type="text" id="sName" placeholder="如：A大瞬爆闪"></div>
        <div class="form-group"><label>地图 *</label><select id="sMap"></select></div>
        <div class="form-group"><label>英雄 *</label><select id="sAgent"></select></div>
        <div class="form-group"><label>技能 *</label><select id="sAbility"></select></div>
        <div class="form-group"><label>阵营 *</label><select id="sSide"><option value="进攻">进攻</option><option value="防守">防守</option></select></div>
        <div class="form-group"><label>区域</label><input type="text" id="sArea" placeholder="如：A大"></div>
        <div class="form-group"><label>难度</label><select id="sDiff"><option>简单</option><option>中等</option><option>困难</option></select></div>
        <div class="form-group"><label>描述</label><textarea id="sDesc" placeholder="点位说明..."></textarea></div>
        <div class="form-group"><label>步骤图（支持多选，可预览）</label><input type="file" id="sFiles" accept="image/*" multiple onchange="previewFiles()"></div>
        <div class="file-preview" id="filePreview"></div>
        <div class="form-actions">
            <button class="btn-cancel" onclick="closeSubmit()">取消</button>
            <button class="btn-confirm" onclick="doSubmit()">提交投稿</button>
        </div>
    </div>
</div>

const dbName = 'ShuntouLineupsDB';
const dbVer = 1;
let db = null;

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(dbName, dbVer);
        req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
            if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = () => reject(req.error);
    });
}

function storeFile(key, blob) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

function getFile(key) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const req = tx.objectStore('files').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

function getSubmissions() {
    try {
        return JSON.parse(localStorage.getItem('lu_submissions') || '[]');
    } catch(e) { return []; }
}
function saveSubmissions(arr) {
    localStorage.setItem('lu_submissions', JSON.stringify(arr));
}

const CN_MAPS = {summit:'深海明珠', ascent:'亚海悬城', sunset:'日落之城', haven:'隐世修所', split:'裂变峡谷', breeze:'微风岛屿', lotus:'莲华古城'};

let allLineups = [];
let currentFilter = { map:'', agent:'', ability:'', side:'', search:'' };

function init() {
    openDB();
    const maps = {}, agents = {}, abilities = {};
    DATA.maps = CN_MAPS;
    DATA.lineups.forEach(l => { l.mapName = CN_MAPS[l.mapId] || l.mapId; });
    allLineups = [...DATA.lineups, ...getSubmissions()];
    
    DATA.lineups.forEach(l => {
        maps[l.mapId] = CN_MAPS[l.mapId] || l.mapId;
        agents[l.agentId] = l.agentName || l.agentId;
        abilities[l.abilityId] = l.abilityId;
    });
    
    const fMap = document.getElementById('fMap');
    const fAgent = document.getElementById('fAgent');
    const fAbility = document.getElementById('fAbility');
    const fSide = document.getElementById('fSide');
    
    fMap.innerHTML = '<option value="">全部地图</option>' + Object.entries(maps).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
    fAgent.innerHTML = '<option value="">全部英雄</option>' + Object.entries(agents).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
    
    const abMap = {};
    DATA.lineups.forEach(l => {
        if (!abMap[l.agentId]) abMap[l.agentId] = new Set();
        abMap[l.agentId].add(l.abilityId);
    });
    
    function updateAbilities() {
        const aid = fAgent.value;
        const abs = abMap[aid] ? [...abMap[aid]] : [];
        fAbility.innerHTML = '<option value="">全部技能</option>' + abs.map(a => `<option value="${a}">${a}</option>`).join('');
    }
    fAgent.addEventListener('change', updateAbilities);
    
    [fMap, fAgent, fAbility, fSide].forEach(el => el.addEventListener('change', () => {
        currentFilter.map = fMap.value;
        currentFilter.agent = fAgent.value;
        currentFilter.ability = fAbility.value;
        currentFilter.side = fSide.value;
        render();
    }));
    
    document.getElementById('searchInput').addEventListener('input', function() {
        currentFilter.search = this.value.trim();
        document.getElementById('searchClear').classList.toggle('show', !!currentFilter.search);
        render();
    });
    
    document.getElementById('searchClear').addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        currentFilter.search = '';
        this.classList.remove('show');
        render();
        document.getElementById('searchInput').focus();
    });
    
    render();
}

function filterLineups() {
    return allLineups.filter(l => {
        if (currentFilter.map && l.mapId !== currentFilter.map) return false;
        if (currentFilter.agent && l.agentId !== currentFilter.agent) return false;
        if (currentFilter.ability && l.abilityId !== currentFilter.ability) return false;
        if (currentFilter.side && l.side !== currentFilter.side) return false;
        if (currentFilter.search) {
            const s = currentFilter.search.toLowerCase();
            return (l.title||'').toLowerCase().includes(s) ||
                   (l.area||'').toLowerCase().includes(s) ||
                   (l.description||'').toLowerCase().includes(s) ||
                   (l.agentName||'').toLowerCase().includes(s) ||
                   (l.mapName||'').toLowerCase().includes(s);
        }
        return true;
    });
}

let selectedId = null;

function render() {
    const filtered = filterLineups();
    document.getElementById('listCount').textContent = `共 ${filtered.length} 个点位`;
    
    const container = document.getElementById('listContainer');
    container.innerHTML = filtered.map(l => {
        const thumb = l.images && l.images[0] ? l.images[0].url : '';
        const isSub = l._submission;
        const cls = selectedId === l.id ? 'card active' : 'card';
        return `<div class="${cls}" onclick="selectLineup(${l.id})" data-id="${l.id}">
            ${thumb ? `<img class="thumb" data-src="${thumb}" onerror="retryImage(this,3)">` : '<div class="thumb"></div>'}
            <div class="info">
                <div class="title">${isSub ? '<span class="tag">我的投稿</span> ' : ''}${escHtml(l.title)}</div>
                <div class="meta">
                    <span>${l.mapName}</span><span>${l.agentName||l.agentId}</span><span>${DATA.abilities[l.abilityId]||l.abilityId.split('-').pop()}</span><span>${l.side}</span>
                </div>
            </div>
        </div>`;
    }).join('');
    
    if (selectedId && !filtered.find(l => l.id === selectedId)) {
        selectedId = null;
        document.getElementById('detailPanel').innerHTML = '<div class="detail-empty">选择一个点位查看详情</div>';
    }
    observeLazyImages();
}

function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function retryImage(img, retries) {
    const url = img.dataset.origSrc || img.dataset.src || img.src || '';
    if (!img.dataset.origSrc && url) img.dataset.origSrc = url;
    img.dataset.retryCount = (parseInt(img.dataset.retryCount)||0) + 1;
    if (img.dataset.retryCount > retries) {
        img.style.opacity = '0.3';
        img.style.filter = 'grayscale(1)';
        return;
    }
    setTimeout(() => {
        img.src = img.dataset.origSrc + '?t=' + Date.now();
    }, 500 * img.dataset.retryCount);
}

// IntersectionObserver: 图片滚动到可见区域才加载
const imgObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const img = entry.target;
            const src = img.dataset.src;
            if (src && !img.src) {
                img.src = src;
            }
            imgObserver.unobserve(img);
        }
    });
}, { rootMargin: '200px' });

function observeLazyImages() {
    document.querySelectorAll('img[data-src]').forEach(img => imgObserver.observe(img));
}

async function selectLineup(id) {
    selectedId = id;
    render();
    if (window.innerWidth <= 768) {
        document.querySelector('.main').classList.add('detail-open');
        document.getElementById('detailPanel').scrollTop = 0;
    }
    
    const lu = allLineups.find(l => l.id === id);
    if (!lu) return;
    
    let stepsHtml = '';
    if (lu.images && lu.images.length > 0) {
        const isMobile = window.innerWidth <= 768;
        for (let i = 0; i < lu.images.length; i++) {
            const img = lu.images[i];
            const attrs = isMobile
                ? `data-src="${img.url}"`
                : `src="${img.url}"`;
            stepsHtml += `<div class="step-box">
                <img class="lazy-img" ${attrs} onclick="openViewer('${img.url}')" onerror="retryImage(this,3)" data-blobkey="${img._blobKey||''}">
                ${img.desc ? `<div class="step-desc">${escHtml(img.desc)}</div>` : ''}
            </div>`;
        }
    } else {
        stepsHtml = '<p style="color:var(--text2)">暂无步骤图</p>';
    }
    
    document.getElementById('detailPanel').innerHTML = `
        <div class="detail-header">
            <h2>${lu._submission ? '<span class="tag">我的投稿</span> ' : ''}${escHtml(lu.title)}</h2>
            <div class="detail-meta">
                <span>地图：${lu.mapName}</span><span>英雄：${lu.agentName||lu.agentId}</span><span>技能：${DATA.abilities[lu.abilityId]||lu.abilityId}</span><span>阵营：${lu.side}</span>
                ${lu.area ? `<span>区域：${escHtml(lu.area)}</span>` : ''}
                ${lu.difficulty ? `<span>难度：${escHtml(lu.difficulty)}</span>` : ''}
            </div>
            ${lu.description ? `<div class="detail-desc">${escHtml(lu.description).replace(/\n/g,'<br>')}</div>` : ''}
        </div>
        <div class="steps">${stepsHtml}</div>
        ${lu.contributor ? `<div class="detail-contributor">投稿者：${escHtml(lu.contributor)}</div>` : ''}
    `;
    
    // Load blob images
    if (lu.images) {
        for (let img of lu.images) {
            if (img._blobKey) {
                const blob = await getFile(img._blobKey);
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const el = document.querySelector(`img[data-blobkey="${img._blobKey}"]`);
                    if (el) {
                        el.src = url;
                        el.onclick = () => openViewer(url);
                    }
                }
            }
        }
    }
    
    // Scroll to top on mobile
    document.getElementById('detailPanel').scrollTop = 0;
    observeLazyImages();
}

function openViewer(url) {
    const imgEl = document.getElementById('imgViewerImg');
    imgEl.src = url;
    document.getElementById('imgViewer').classList.add('show');
}
document.getElementById('imgViewer').addEventListener('click', () => {
    document.getElementById('imgViewer').classList.remove('show');
    document.getElementById('imgViewerImg').src = '';
});

// ============ SUBMIT ============
let pendingFiles = [];

function openSubmit() {
    document.getElementById('submitModal').classList.add('show');
    pendingFiles = [];
    document.getElementById('filePreview').innerHTML = '';
    document.getElementById('sFiles').value = '';
    // Populate maps / agents / abilities
    const sMap = document.getElementById('sMap');
    sMap.innerHTML = Object.entries(CN_MAPS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
    const sAgent = document.getElementById('sAgent');
    const agentSet = new Set();
    DATA.lineups.forEach(l => agentSet.add(JSON.stringify([l.agentId, l.agentName||l.agentId])));
    sAgent.innerHTML = [...agentSet].map(s => { const [id,name] = JSON.parse(s); return `<option value="${id}">${name}</option>`; }).join('');
    
    const sAbility = document.getElementById('sAbility');
    function updateSAbilities() {
        const aid = sAgent.value;
        const abSet = new Set();
        DATA.lineups.forEach(l => { if (l.agentId === aid) abSet.add(l.abilityId); });
        sAbility.innerHTML = [...abSet].map(a => `<option value="${a}">${a}</option>`).join('');
    }
    sAgent.onchange = updateSAbilities;
    updateSAbilities();
}

function closeSubmit() {
    document.getElementById('submitModal').classList.remove('show');
}

function previewFiles() {
    const input = document.getElementById('sFiles');
    pendingFiles = Array.from(input.files);
    const preview = document.getElementById('filePreview');
    preview.innerHTML = '';
    pendingFiles.forEach((file, i) => {
        const url = URL.createObjectURL(file);
        preview.innerHTML += `<div class="preview-item">
            <img src="${url}" alt="">
            <button class="remove-file" onclick="removeFile(${i})">&times;</button>
        </div>`;
    });
}

function removeFile(i) {
    pendingFiles.splice(i, 1);
    previewFiles();
}

async function doSubmit() {
    const name = document.getElementById('sName').value.trim();
    const mapId = document.getElementById('sMap').value;
    const agentId = document.getElementById('sAgent').value;
    const abilityId = document.getElementById('sAbility').value;
    const side = document.getElementById('sSide').value;
    
    if (!name || !mapId || !agentId || !abilityId) {
        alert('请填写点位名称、地图、英雄和技能');
        return;
    }
    
    const area = document.getElementById('sArea').value.trim();
    const difficulty = document.getElementById('sDiff').value;
    const desc = document.getElementById('sDesc').value.trim();
    
    const images = [];
    for (let i = 0; i < pendingFiles.length; i++) {
        const blobKey = 'sub_' + Date.now() + '_' + i;
        await storeFile(blobKey, pendingFiles[i]);
        images.push({ url: '', desc: '', _blobKey: blobKey });
    }
    
    const newId = Date.now();
    const submission = {
        id: newId,
        mapId, agentId, abilityId, side,
        title: name,
        area, difficulty,
        description: desc,
        images,
        mapName: CN_MAPS[mapId] || mapId,
        agentName: document.getElementById('sAgent').selectedOptions[0].text,
        tags: ['社区投稿'],
        contributor: '我',
        _submission: true,
        patch: '当前版本'
    };
    
    const subs = getSubmissions();
    subs.push(submission);
    saveSubmissions(subs);
    allLineups = [...DATA.lineups, ...subs];
    
    closeSubmit();
    render();
    selectLineup(newId);
}

function closeDetail() {
    document.querySelector('.main').classList.remove('detail-open');
}

// 窗口变大时自动退出手机详情模式
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.querySelector('.main').classList.remove('detail-open');
    }
});
init();
</script>
